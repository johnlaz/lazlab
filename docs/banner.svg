<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">LAZLAB Hub</title>
  <desc id="d">LAZLAB Hub: where every experiment gets wired. Load a build, watch it break, fix it faster.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0614"/><stop offset="1" stop-color="#040406"/>
